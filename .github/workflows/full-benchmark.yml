name: Full publication benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Measure ten complete TLC months, including staged publication
        run: >-
          python scripts/benchmark.py --dataset full --download
          --months 2023-01 2023-02 2023-03 2023-04 2023-05
          2023-06 2023-07 2023-08 2023-09 2023-10
          --memory-limit 3GB --timeout 1800
          --output "${{ runner.temp }}/full-evidence/full-publication.json"
      - name: Retain run evidence even if the pipeline fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-publication-${{ github.sha }}
          path: ${{ runner.temp }}/full-evidence/
          if-no-files-found: warn
          retention-days: 30
