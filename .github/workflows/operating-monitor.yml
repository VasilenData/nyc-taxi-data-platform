name: Historical replay schedule monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '47 6 15-30 11 *'
    - cron: '47 6 1-15 12 *'
permissions:
  contents: read
  actions: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the explicit operating window
        id: window
        run: python scripts/check_replay_schedule.py eligibility --monitor >> "$GITHUB_OUTPUT"
      - name: Reconcile committed expected slots against actual scheduled runs
        if: steps.window.outputs.active == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_replay_schedule.py monitor --output "$RUNNER_TEMP/schedule-monitor"
      - name: Retain report and local alert inbox
        if: always() && steps.window.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: operating-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schedule-monitor/
          retention-days: 45
          if-no-files-found: error
