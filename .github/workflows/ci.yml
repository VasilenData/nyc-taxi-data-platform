name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Parse dbt project
        run: cd dbt && dbt parse --profiles-dir .
        env:
          TAXI_DB: ${{ runner.temp }}/parse.duckdb
      - name: Run the pipeline on the bundled sample, with all checks
        run: python run_pipeline.py 2023-01 2023-02 | grep -E "^check (reconciliation|reject_rate|coverage)"
        env:
          TAXI_DB: ${{ runner.temp }}/ci.duckdb
          TAXI_DATA_DIR: ${{ runner.temp }}/none
      - name: Tests
        run: pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t nyc-taxi-data-platform .
      - name: Start it and wait for the UI
        run: |
          docker run -d --name platform -p 3000:3000 nyc-taxi-data-platform
          for i in $(seq 1 30); do curl -sf localhost:3000/server_info && exit 0; sleep 3; done
          docker logs platform; exit 1
